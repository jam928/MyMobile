<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin · Users')}"></head>
<body>
<header th:replace="~{fragments :: header('admin')}"></header>

<main class="container">
	<div th:replace="~{fragments :: admin-header('users')}"></div>

	<div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
	<div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

	<p class="muted small results-bar" th:text="|${users.totalElements} users|">1 user</p>

	<div class="card table-wrap">
		<table class="table">
			<thead>
				<tr>
					<th>Name</th>
					<th>Email</th>
					<th>Role</th>
					<th>Plan</th>
					<th class="num">Lines</th>
					<th class="num">Balance</th>
					<th class="num">Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="user : ${users.content}" th:with="plan=${plans[user.planId]}">
					<td>
						<div class="table-strong" th:text="${user.name}">Name</div>
						<div class="muted small" th:text="'#' + ${user.cid}">#1</div>
					</td>
					<td th:text="${user.email}">email</td>
					<td><span class="badge" th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-primary'" th:text="${user.role.name() == 'ADMIN'} ? 'Admin' : 'Customer'">Customer</span></td>
					<td>
						<th:block th:if="${plan}" th:text="${'$' + #numbers.formatDecimal(plan.monthlyRate, 1, 'COMMA', 2, 'POINT')} + '/mo · ' + ${plan.numberOfLines == 1 ? '1 line' : 'up to ' + plan.numberOfLines + ' lines'}">plan</th:block>
						<span class="muted" th:unless="${plan}">No plan</span>
					</td>
					<td class="num" th:text="${user.phoneLines}">0</td>
					<td class="num" th:text="${'$' + #numbers.formatDecimal(user.balance, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
					<td class="num">
						<span class="muted small" th:if="${user.cid == currentUserId}">You</span>
						<th:block th:unless="${user.cid == currentUserId}">
							<form th:if="${user.role.name() != 'ADMIN'}" th:action="@{/admin/users/{cid}/role(cid=${user.cid})}" method="post"
								onsubmit="return confirm('Give this user admin access?')">
								<input type="hidden" name="role" value="ADMIN">
								<input type="hidden" name="page" th:value="${users.number + 1}">
								<button class="btn btn-secondary btn-sm" type="submit">Make admin</button>
							</form>
							<form th:if="${user.role.name() == 'ADMIN'}" th:action="@{/admin/users/{cid}/role(cid=${user.cid})}" method="post"
								onsubmit="return confirm('Remove this user\'s admin access?')">
								<input type="hidden" name="role" value="CUSTOMER">
								<input type="hidden" name="page" th:value="${users.number + 1}">
								<button class="btn btn-danger btn-sm" type="submit">Remove admin</button>
							</form>
						</th:block>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<nav th:replace="~{fragments :: pagination(${users}, '/admin/users')}"></nav>
</main>
</body>
</html>
