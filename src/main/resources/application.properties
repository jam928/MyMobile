spring.application.name=mymobile

# Keep the legacy URL layout: http://localhost:8080/MyMobile/...
server.servlet.context-path=/MyMobile

# --- Database (replaces the c3p0 "myDataSource" bean) ---
# Defaults target the MySQL container from docker-compose.yml; override with
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/mymobile
spring.datasource.username=mymobile
spring.datasource.password=mymobile
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000

# --- Flyway: applies src/main/resources/db/migration/V*__*.sql on startup ---
# Databases created before Flyway was added already contain V1-V3, so they are baselined at 3.
# (Baselining only happens when the schema has tables but no flyway_schema_history table.)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

# --- JPA / Hibernate (replaces the sessionFactory and transaction manager beans) ---
# Flyway owns the schema; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Keep the legacy column names (planId, numberOfLines, monthlyRate) instead of snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# --- MinIO (phone photos) ---
# Override with MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY / MINIO_BUCKET.
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=phones

# --- Photo uploads (admin "Add phone") ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# read (and discard) oversized uploads so the browser gets the "Upload too large" page instead of a reset connection
server.tomcat.max-swallow-size=20MB

# --- OpenAPI / Swagger UI (http://localhost:8080/MyMobile/swagger-ui.html) ---
# only document the JSON API, not the HTML pages
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
# send the CSRF token from the XSRF-TOKEN cookie with PUT/POST/DELETE requests
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
