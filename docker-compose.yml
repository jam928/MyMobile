services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mymobile
      MYSQL_USER: mymobile
      MYSQL_PASSWORD: mymobile
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The upstream minio/minio image is no longer published; pgsty/minio is a
  # maintained build of the MinIO community edition.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: creates the "phones" bucket and uploads the seed photos.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/seed:/seed:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/phones &&
      mc mirror --overwrite /seed local/phones
      "

  # Runs the app from source with `mvn spring-boot:run`; restart the service to pick up code changes.
  app:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    command: mvn -B spring-boot:run
    volumes:
      - .:/app
      - maven-repo:/root/.m2   # cache downloaded dependencies between runs
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mymobile
      SPRING_DATASOURCE_USERNAME: mymobile
      SPRING_DATASOURCE_PASSWORD: mymobile
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: phones
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Unit + integration tests with a coverage summary at the end (not started by `docker compose up`):
  #   docker compose run --rm tests
  # The integration tests start their own MySQL with Testcontainers, through the host's Docker.
  tests:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /app
    command: sh /app/scripts/run-tests.sh
    volumes:
      - .:/app
      - maven-repo:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # containers started by Testcontainers are reached through the host's published ports
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:
  minio-data:
  maven-repo:
